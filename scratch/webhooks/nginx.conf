# Webhook sink: logs every request (headers + raw body) as one JSON line.
# $request_body is only populated when nginx reads the body, which it does
# for proxy_pass; so 8090 proxies to a trivial sink server on 8091.
log_format webhook escape=json
  '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri",'
  '"content_type":"$content_type","content_length":"$content_length",'
  '"klaviyo_signature":"$http_klaviyo_signature","klaviyo_timestamp":"$http_klaviyo_timestamp",'
  '"user_agent":"$http_user_agent","body":"$request_body"}';

server {
    listen 8090;
    server_name _;
    client_max_body_size 10m;
    client_body_buffer_size 10m;

    access_log /var/log/nginx/webhooks.jsonl webhook;

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # OAuth redirect target. The request is logged like everything else (oauth.php exchange reads the
    # code from the log); the response just tells the person in the browser what to do next.
    location = /oauth/callback {
        default_type text/plain;
        if ($arg_error) {
            return 200 "Klaviyo denied the authorization: $arg_error\n\nRun `php scratch/oauth.php link` again to retry.\n";
        }
        if ($arg_code) {
            return 200 "Authorization code received.\n\nNow run:\n\n    php scratch/oauth.php exchange\n\nIt reads the code from webhooks/logs/webhooks.jsonl and writes .oauth.json.\n";
        }
        proxy_pass http://127.0.0.1:8091;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
    }
}

server {
    listen 127.0.0.1:8091;
    access_log off;
    default_type text/plain;
    location / {
        return 200 "ok\n";
    }
}
